name: Deploy Rowan Flappy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - game.js
      - engine.mjs
      - audio.mjs
      - fullscreen.mjs
      - fullscreen.css
      - assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify game code
        run: |
          node --check game.js
          node --check engine.mjs
          node --check audio.mjs
          node --check fullscreen.mjs
          node --test tests/*.test.mjs

      - name: Package the game
        run: |
          mkdir -p _site
          cp index.html styles.css fullscreen.css game.js engine.mjs audio.mjs fullscreen.mjs _site/
          cp -R assets _site/assets
          touch _site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
