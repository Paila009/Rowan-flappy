<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 160" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Rowan's tiny Shih Tzu rival</title>
  <desc id="desc">A fluffy tan and white Shih Tzu with a funny determined expression and one raised paw.</desc>
  <g stroke="#242822" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- A compact fluffy body and a wagging tail. -->
    <path d="M105 111c15-17 25-6 18 3 11 3 7 15-7 15" fill="#b48a61"/>
    <path d="M47 99c-9 11-12 22-10 34l-3 7 8 1c2 8 16 10 24 5 8 5 19 4 25 1 13 3 24-2 23-10l5-3-6-7c-1-17-8-27-18-31" fill="#fffaf0"/>
    <path d="M94 109c11 8 12 20 9 29l9 1 3-6-4-9-5-13" fill="#b48a61" stroke="none"/>
    <path d="M49 129l-3 11m16-6-1 10m32-10 2 10m-45-36c-13 1-19 12-16 18 3 5 9 5 12 1"/>
    <!-- Raised paw, held out to deliver a very unserious bonk. -->
    <path d="M106 103c6-6 8-12 9-19-5-2-8-8-6-12l5-2c-1-6 3-10 7-7 3-6 9-5 10 0 7-2 10 4 6 9 7 4 6 11 0 15-5 4-10 3-14 2-1 12-4 23-12 27" fill="#fffaf0"/>
    <path d="m117 74 1 4m7-6 1 5m7-3-1 4" stroke-width="2.5"/>
    <path d="M122 81c1-3 7-4 9-1 3 5-4 7-7 5" fill="#f2745b" stroke-width="2"/>
    <!-- Long silky ears frame the round Shih Tzu face. -->
    <path d="M45 38C25 25 14 47 17 67l-5 10 6 1-1 11 8-2c3 10 13 15 23 9l9-35" fill="#b48a61"/>
    <path d="M102 37c21-13 32 7 30 25l5 12-6 3 2 10-8-1c-3 11-13 15-23 8l-9-33" fill="#b48a61"/>
    <path d="M30 49c-5 10-6 19-3 30m94-31c5 11 5 20 2 29" stroke="#886346" stroke-width="2.5"/>
    <!-- Fluffy cheek tufts, crown, and a white blaze. -->
    <path d="M37 39c-1-9 5-14 13-13 0-8 9-13 16-7 4-9 14-9 18-1 8-6 17-1 16 7 10-2 16 6 13 14 8 5 8 15 2 20l4 11-6 4 4 10-9 3c2 9-8 16-16 14l-5 6-11-4-11 4-6-6c-11 4-19-2-19-11l-10-4 5-9-6-6 5-10c-7-8-6-16 4-22Z" fill="#fffaf0"/>
    <path d="M39 38c3-8 10-11 17-9 3-8 12-8 15-3l-6 12-2 22-10 9-18-4c-4-9-3-18 4-22Zm69-1c-4-7-11-10-17-7-2-7-10-8-14-3l7 11 3 22 10 8 17-4c4-10 1-18-6-22Z" fill="#b48a61" stroke="none"/>
    <path d="m68 24 7 6 7-6m-7 6-1 16" stroke-width="2.5"/>
    <!-- Heavy brows and glossy eyes: grumpy, but entirely adorable. -->
    <path d="m45 49 14 5m46-5-14 5" stroke-width="4"/>
    <ellipse cx="53" cy="63" rx="7" ry="8" fill="#242822" stroke-width="2"/>
    <ellipse cx="97" cy="63" rx="7" ry="8" fill="#242822" stroke-width="2"/>
    <circle cx="55" cy="60" r="2" fill="#fffaf0" stroke="none"/>
    <circle cx="99" cy="60" r="2" fill="#fffaf0" stroke="none"/>
    <!-- The short dark muzzle and moustache distinguish this little breed. -->
    <path d="M49 78c3-11 16-13 26-7 10-6 23-4 26 7l-6 3 6 5-10 2-1 8-15-6-15 6-1-8-10-2 6-5Z" fill="#fffaf0" stroke-width="2.5"/>
    <path d="M65 74c2-5 18-5 20 0 1 4-6 9-10 9s-11-5-10-9Z" fill="#242822"/>
    <path d="M75 82v6m-9 1c4 5 7 0 9-1 2 1 5 6 9 1" stroke-width="2.5"/>
    <path d="M72 93c0 8 8 9 9 0" fill="#f2745b" stroke-width="2"/>
    <path d="m46 76-6-2m7 9-7 1m64-8 6-2m-7 9 7 1" stroke-width="2"/>
    <!-- A coral bandana makes the silhouette read at small sizes. -->
    <path d="m56 102 19 7 19-7-5 13-14 12-14-12Z" fill="#f2745b"/>
    <path d="m70 111 5 6 5-6" stroke-width="2"/>
  </g>
</svg>
