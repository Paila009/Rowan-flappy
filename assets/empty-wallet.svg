<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 100" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">The dramatically empty wallet</title>
  <desc id="desc">An open brown cartoon wallet with an empty dark interior, one fleeing banknote, and a long dangling receipt.</desc>
  <g transform="translate(2 1) scale(.96)" stroke="#242822" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- A runaway note and two tiny motion marks. -->
    <g transform="rotate(-24 30 18)">
      <path d="M13 9h35v19H13Z" fill="#d7e4b1"/>
      <path d="M18 13h25v11H18Z" stroke-width="1.5"/>
      <ellipse cx="30.5" cy="18.5" rx="4" ry="5" fill="#fffaf0" stroke-width="1.5"/>
    </g>
    <path d="m7 36 9-3m-4 10 9-4" stroke="#b48a61" stroke-width="2.5"/>
    <!-- The rear fold is visible behind the cavernous, empty opening. -->
    <path d="M42 31 99 21c8-1 14 4 15 10l8 23-84 8-7-18c-2-6 2-11 11-13Z" fill="#b48a61"/>
    <path d="m43 38 57-10c4-1 7 1 8 5l4 12-68 10-4-10c-1-3 0-6 3-7Z" fill="#fffaf0" stroke-width="2"/>
    <path d="M30 48c7-12 77-21 92-8l4 15-90 17Z" fill="#242822"/>
    <path d="M42 47c15-7 52-13 69-8" stroke="#886346" stroke-width="2.5"/>
    <!-- A last receipt drapes over the front lip. -->
    <path d="m94 39 19-2 9 48-5-2-3 5-5-4-3 5-10-44Z" fill="#fffaf0" stroke-width="2.5"/>
    <path d="m100 46 9-1m-8 7 9-1m-8 7 9-1m-7 7 8-1m-6 7 7-1" stroke="#b48a61" stroke-width="1.5"/>
    <!-- The battered front panel and generous amber clasp. -->
    <path d="M27 48c25 6 67 4 98-8l6 36c1 7-3 12-10 14L47 99c-8 1-12-4-13-10Z" fill="#b48a61"/>
    <path d="M37 57c24 4 54 0 79-7l5 26c1 3-1 6-5 7l-66 8c-3 0-6-1-6-5Z" stroke="#fffaf0" stroke-width="1.5" stroke-dasharray="3 5"/>
    <path d="M110 57c-10 2-17 5-16 12l1 4c1 5 8 6 19 2l19-6-3-17Z" fill="#e8b653"/>
    <circle cx="106" cy="67" r="3.5" fill="#fffaf0" stroke-width="2"/>
    <!-- A little scuff gives the purse comic character. -->
    <path d="m56 71 8-2m-5 7 7-2" stroke="#886346" stroke-width="2.5"/>
  </g>
</svg>
